[package]
name = "berryit-control-center"
version = "0.1.0"
description = "BERRYiT Control Center"
authors = ["BERRYiT"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "berryit_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Windows Credential Manager. Sessionstoken lagras där, aldrig i localStorage
# eller i en fil i klartext.
keyring = { version = "3", default-features = false, features = ["windows-native"] }
thiserror = "2"
tauri-plugin-http = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
