name: Verify

permissions:
  contents: read

on:
  push:
    branches: [feat/support-desk]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:safety-test
      - run: npm run db:test
      - run: npm run db:upgrade-test
      - run: node --test services/connector-engine/engine.test.mjs services/connector-engine/monitoring.test.mjs services/communications/email-adapter.test.mjs services/onarly-ai-adapter/server.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm ci --prefix desktop
      - run: npm test --prefix desktop
      - run: npm run build --prefix desktop
